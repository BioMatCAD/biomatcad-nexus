[project]
name = "biomatcad-api"
version = "0.1.0"
description = "BioMatCAD Nexus — API (FastAPI). Incremento 1: fundação executável."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20",
    "psutil>=5.9",  # Incremento 2.1.1 (itens 3 e 7): encerramento real de arvore de processos
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-passlib>=1.7",
    "pgserver>=0.1.4",
    "types-jsonschema>=4.20",
    "types-psutil>=5.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: Depends(...) em default de argumento é o padrão idiomático do FastAPI, não um bug.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomatcad_api"]
