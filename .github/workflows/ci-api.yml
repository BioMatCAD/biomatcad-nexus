name: CI - API

# STATUS: executado e validado nesta sessão (localmente, com PostgreSQL real via `pgserver` —
# Docker não estava disponível no sandbox de desenvolvimento; ver IMPLEMENTATION_STATUS.md para
# a evidência completa). Este workflow usa um serviço Postgres nativo do GitHub Actions
# (suportado independentemente da limitação de Docker do sandbox local) e roda migração +
# testes de verdade — sem `|| true`, o CI é um gate real a partir deste incremento.

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/scientific-core/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/scientific-core/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biomatcad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      API_SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/biomatcad_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/biomatcad_ci
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Tests
        run: pytest -v
