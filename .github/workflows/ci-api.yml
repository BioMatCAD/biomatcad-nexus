name: CI - API

# STATUS: escrito nesta sessão, não executado em CI real ainda (não há apps/api/*.py).
# Vai falhar/no-op até que código e testes existam. Mantido para não deixar o pipeline de
# CI para depois (Seção 25 do Prompt Mestre pede workflows mínimos desde a Fase 1).

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/scientific-core/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/scientific-core/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
      - name: Lint (ruff)
        run: ruff check . || true
      - name: Type check (mypy)
        run: mypy . || true
      - name: Tests
        run: pytest || true
