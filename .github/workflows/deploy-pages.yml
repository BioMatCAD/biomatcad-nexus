name: Deploy Pages

# STATUS: escrito e sintaticamente validado nesta sessão, mas NUNCA EXECUTADO contra um
# repositório GitHub real (não há repositório remoto conectado nesta sessão) — ver
# IMPLEMENTATION_STATUS.md. Revisar o nome do repositório em BASE_PATH antes do primeiro deploy
# real: deve corresponder exatamente a "/<nome-do-repositorio>/" (Prompt Mestre §7.1).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      BASE_PATH: /biomatcad-nexus/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
