name: CI - Web

# STATUS: executado e validado nesta sessão (localmente, com npm — não pnpm; ver
# IMPLEMENTATION_STATUS.md). Sem `|| true`: o CI é um gate real a partir deste incremento.

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/contracts/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/contracts/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npx vitest run
      - name: Build (produção)
        run: npm run build
      - name: Build (GitHub Pages demo)
        run: npm run build:pages
