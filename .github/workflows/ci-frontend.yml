name: CI - Web

# STATUS: escrito nesta sessão, não executado em CI real ainda (apps/web ainda não tem código
# nem package.json próprio). `|| true` evita quebrar o pipeline enquanto não há nada para
# testar — REMOVER assim que apps/web tiver lint/test reais, para o CI voltar a ser um gate real.

on:
  push:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/contracts/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/contracts/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || true
      - name: Lint
        run: pnpm lint || true
      - name: Type check
        run: pnpm -r exec tsc --noEmit || true
      - name: Tests
        run: pnpm test || true
